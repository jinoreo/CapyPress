<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豚压-CapyPress | 图片压缩工具</title>
    <script>
        // 添加路径处理函数
        window.getAssetPath = function(path) {
            // 检查是否是 vansun.top 域名
            if (window.location.hostname === 'www.vansun.top') {
                return `/capypress/${path.replace('./', '')}`;
            }
            // 其他情况（本地开发和 Vercel）使用原始路径
            return path;
        }
    </script>
    <!-- 直接使用处理后的路径 -->
    <script>
        const cssPath = getAssetPath('./styles.css');
        const iconPath = getAssetPath('./assets/capybara-icon.svg');
        const scriptPath = getAssetPath('./script.js');
        document.write(`
            <link rel="stylesheet" href="${cssPath}">
            <link rel="icon" type="image/svg+xml" href="${iconPath}">
            <script src="${scriptPath}" defer><\/script>
        `);
    </script>
</head>
<body>
    <div class="container">
        <h1>
            <!-- 直接使用处理后的路径 -->
            <script>document.write(`<img src="${getAssetPath('./assets/capybara-icon.svg')}" alt="水豚图标" class="logo">`);</script>
            豚压-CapyPress
        </h1>
        <div class="upload-area" id="uploadArea">
            <!-- 直接使用处理后的路径 -->
            <script>document.write(`<img src="${getAssetPath('./assets/capybara-icon.svg')}" alt="上传图标">`);</script>
            <p>点击或拖拽图片到这里</p>
            <p class="subtitle">让水豚帮你压缩图片吧！</p>
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
        
        <div class="preview-container" id="previewContainer" style="display: none;">
            <div class="preview-box">
                <h3>原图</h3>
                <img id="originalImage" alt="原图预览">
                <div class="image-info" id="originalInfo">
                    <span class="info-size"></span>
                    <span class="info-dimensions"></span>
                </div>
            </div>
            <div class="preview-box">
                <h3>压缩后</h3>
                <img id="compressedImage" alt="压缩后预览">
                <div class="image-info" id="compressedInfo">
                    <span class="info-size"></span>
                    <span class="info-dimensions"></span>
                </div>
            </div>
        </div>
        
        <div class="controls" id="controls" style="display: none;">
            <div class="control-group">
                <div class="quality-control">
                    <label for="quality">压缩质量：</label>
                    <input type="range" id="quality" min="0" max="100" value="80">
                    <span id="qualityValue">80%</span>
                </div>
                <div class="format-control">
                    <label for="format">输出格式：</label>
                    <select id="format">
                        <option value="auto">自动选择</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                        <option value="png">PNG</option>
                    </select>
                </div>
            </div>
            <div class="control-group">
                <div class="size-control">
                    <label>
                        <input type="checkbox" id="maintainSize" checked>
                        保持原始尺寸
                    </label>
                    <div class="max-size-control" style="display: none;">
                        <label for="maxWidth">最大宽度：</label>
                        <input type="number" id="maxWidth" value="2048" min="100" max="4096">px
                    </div>
                </div>
            </div>
            <div class="compression-info" id="compressionInfo"></div>
            <button id="downloadBtn" class="download-btn">下载压缩后的图片</button>
        </div>
    </div>
    <script>
        // 处理图片资源路径
        window.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('img[src]').forEach(img => {
                if (img.getAttribute('src').startsWith('./')) {
                    img.src = getAssetPath(img.getAttribute('src'));
                }
            });
        });
    </script>
</body>
</html>
